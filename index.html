<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alan's Toolkit</title>
<meta name="theme-color" content="#e8332a">
<meta name="description" content="Sales Tools, Audio, Lighting and Converters calculators.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="toolkit-192.png">
<link rel="apple-touch-icon" href="toolkit-192.png">
<script>
(function(){
  try{
    var t = localStorage.getItem("toolkitTheme");
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  }catch(e){
    document.documentElement.setAttribute("data-theme","dark");
  }
})();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="header-tools">
      <button class="theme-toggle" id="unitToggle" type="button" title="Distance units used by the SPL calculators"></button>
      <button class="theme-toggle" id="themeToggle" type="button"></button>
    </div>
    <h1>Alan's Toolkit</h1>
    <p>Sales Tools, Audio, Lighting and Converters — robots in disguise, calculators in the open.</p>
  </header>

  <div class="search-wrap">
    <input type="text" id="searchBox" placeholder="Search calculators (e.g. tax, SPL, Shure)…" autocomplete="off" aria-label="Search calculators">
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <div class="section-tabs" id="sectionTabs"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-panel" id="mainPanel"></div>
  </div>

  <footer>Alan's Toolkit — built from the Super Spreadsheet. dB Level Converter originally created by Murat Böyük Pilavci (stardustmedia). Beastformer typeface used for headers.</footer>
</div>

<script src="js/core.js"></script>
<script src="calculators/sales.js"></script>
<script src="calculators/spl.js"></script>
<script src="calculators/audio.js"></script>
<script src="calculators/lighting.js"></script>
<script src="calculators/converters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
