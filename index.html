  :root, html[data-theme="dark"]{
    --bg: #0c0d10;
    --bg-2: #08090b;
    --card: #1b1e25;
    --card-2: #262b34;
    --border: #3a4152;
    --border-strong: #565f70;
    --text: #ffffff;
    --text-muted: #aab1c0;
    --accent: #e8332a;
    --accent-hover: #c22a22;
    --accent-2: #4a9eef;
    --accent-soft: #123a63;
    --out-border: #4a9eef;
    --label-accent: #8fc5ff;
    --radius: 6px;
    --shadow: 0 0 0 1px rgba(74,158,239,0.15), 0 10px 26px rgba(0,0,0,0.5);
    --font-display: "Beastformer", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }
  html[data-theme="light"]{
    --bg: #e4e7ec;
    --bg-2: #d7dbe2;
    --card: #ffffff;
    --card-2: #f2f3f6;
    --border: #c3c8d1;
    --border-strong: #aab1bd;
    --text: #1a1d24;
    --text-muted: #5b6172;
    --accent: #d6261c;
    --accent-hover: #b31f16;
    --accent-2: #1d55a3;
    --accent-soft: #eaf0fb;
    --out-border: #b7cbef;
    --label-accent: #1d55a3;
    --shadow: 0 1px 2px rgba(20,20,43,0.06), 0 8px 24px rgba(20,20,43,0.08);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    background-image: linear-gradient(160deg, rgba(74,158,239,0.06) 0%, transparent 40%), linear-gradient(-20deg, rgba(232,51,42,0.05) 0%, transparent 35%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 20px 16px 48px;
  }
  .wrap{ max-width: 1100px; margin: 0 auto; }
  header.app-header{ text-align:center; margin-bottom: 20px; position:relative; }
  .theme-toggle{
    font-family:inherit; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:7px 14px; border-radius:999px; border:1px solid var(--border-strong);
    background:var(--card); color:var(--text-muted); cursor:pointer;
  }
  .theme-toggle:hover{ border-color:var(--accent-2); color:var(--text); }
  .header-tools{ position:absolute; top:0; right:0; display:flex; gap:6px; }
  @media (max-width:640px){ .header-tools{ position:static; justify-content:center; margin-bottom:10px; } }

  .search-wrap{ position:relative; max-width:460px; margin:0 auto 16px; }
  .search-wrap input{ width:100%; padding:10px 14px; border-radius:999px; font-size:0.9rem; }
  .search-results{
    position:absolute; left:0; right:0; top:100%; margin-top:6px; z-index:20;
    background:var(--card); border:1px solid var(--border-strong); border-radius:8px; box-shadow:var(--shadow);
    max-height:320px; overflow-y:auto; padding:4px;
  }
  .search-results button{
    display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; font-family:inherit; font-size:0.85rem;
    padding:8px 10px; border:none; background:transparent; color:var(--text); border-radius:4px; cursor:pointer;
  }
  .search-results button:hover, .search-results button.sel{ background:var(--accent-soft); }
  .search-results .sec{ color:var(--text-muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.03em; align-self:center; }
  .search-results .none{ padding:10px; color:var(--text-muted); font-size:0.85rem; }

  .calc-card{ position:relative; }
  .card-tools{ position:absolute; top:10px; right:10px; display:flex; gap:4px; }
  .card-tools button{
    font-family:inherit; font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:3px 8px; border-radius:999px; border:1px solid var(--border-strong); background:var(--card-2);
    color:var(--text-muted); cursor:pointer;
  }
  .card-tools button:hover{ color:var(--text); border-color:var(--accent-2); }
  .calc-card h2{ padding-right:150px; }

  .recent{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px; }
  .recent .lbl{ font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--label-accent); margin-right:4px; }
  .recent button{
    font-family:inherit; font-size:0.78rem; font-weight:600; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border-strong); background:var(--card-2); color:var(--text); cursor:pointer;
  }
  .recent button:hover{ border-color:var(--accent); }

  .hint{ font-size:0.72rem; color:var(--text-muted); margin:-8px 0 14px; line-height:1.4; }
  .note{ font-size:0.75rem; color:var(--text-muted); margin:12px 0 0; line-height:1.4; border-top:1px dashed var(--border); padding-top:10px; }
  .status{ display:inline-block; font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; padding:3px 10px; border-radius:999px; }
  .status.ok{ background:#123524; color:#7fe3ab; border:1px solid #2fa062; }
  .status.warn{ background:#3d1512; color:#ff9a93; border:1px solid #e8332a; }
  html[data-theme="light"] .status.ok{ background:#e3f6ea; color:#1d7a4c; }
  html[data-theme="light"] .status.warn{ background:#fdeceb; color:#b31f16; }
  details.prices{ margin-top:14px; border-top:1px dashed var(--border); padding-top:10px; }
  details.prices summary{ cursor:pointer; font-size:0.78rem; font-weight:700; color:var(--label-accent); text-transform:uppercase; letter-spacing:0.03em; }
  .im-table td.in{ color:#ff9a93; font-weight:800; }
  html[data-theme="light"] .im-table td.in{ color:#b31f16; }
  header.app-header h1{
    font-family: var(--font-display); font-size: 2rem; font-weight: normal; margin: 0 0 6px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--text);
  }
  header.app-header p{ color: var(--text-muted); margin: 0; font-size: 0.9rem; }

  .section-tabs{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom: 18px;
  }
  .section-tabs button{
    font-family: var(--font-display); font-size: 0.85rem; font-weight: normal; letter-spacing:0.04em; text-transform:uppercase;
    padding: 10px 20px; border-radius: 0; clip-path: polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);
    border: 1px solid var(--border-strong);
    background: var(--card); color: var(--text-muted); cursor: pointer;
  }
  .section-tabs button.active{
    background: linear-gradient(135deg,var(--accent),var(--accent-hover)); color: #fff; border-color: var(--accent);
    box-shadow: 0 0 12px rgba(214,38,28,0.45);
  }

  .layout{ display:grid; grid-template-columns: 240px 1fr; gap: 20px; align-items:start; }
  @media (max-width: 780px){ .layout{ grid-template-columns: 1fr; } }

  .sidebar{
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px; display:flex; flex-direction:column; gap:4px;
  }
  .sidebar button{
    text-align:left; font-family:inherit; font-size:0.85rem; font-weight:600;
    padding: 10px 12px; border-radius: 4px; border:none; border-left:3px solid transparent; background:transparent;
    color: var(--text); cursor:pointer;
  }
  .sidebar button.active{ background: var(--accent-soft); color: var(--label-accent); border-left-color: var(--accent); }
  .sidebar button:hover:not(.active){ background:var(--card-2); }

  .main-panel{ display:flex; flex-direction:column; gap:16px; }
  .calc-card{
    background: var(--card); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px;
  }
  .calc-card h2{ font-family: var(--font-display); font-size:1.2rem; margin:0 0 8px; font-weight:normal; letter-spacing:0.03em; text-transform:uppercase; }
  .calc-card .desc{ font-size:0.82rem; color: var(--text-muted); margin: 0 0 16px; line-height:1.45; }
  .calc-card .credit{ font-size:0.72rem; color: var(--text-muted); font-style:italic; margin: -10px 0 16px; }

  .field-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom: 16px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:0.72rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; }
  select, input[type="number"], input[type="text"]{
    font-family:inherit; font-size:0.92rem; padding:8px 10px; border-radius:4px;
    border:1px solid var(--border-strong); background:var(--card-2); color:var(--text); width:100%;
  }
  select:focus, input:focus{ outline:2px solid var(--accent-2); outline-offset:1px; }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button{
    opacity: 1;
  }
  html[data-theme="dark"] input[type="number"]::-webkit-inner-spin-button,
  html[data-theme="dark"] input[type="number"]::-webkit-outer-spin-button{
    filter: invert(1) brightness(1.7);
  }

  .output-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:10px; }
  .out-box{
    background: var(--accent-soft); border:1px solid var(--out-border); border-radius:4px; padding:12px 14px;
  }

<script>
/* ================= Utilities ================= */
function num(id){ const e = document.getElementById(id); if(!e) return 0; const v = parseFloat(e.value); return isNaN(v) ? 0 : v; }
function strVal(id){ const e = document.getElementById(id); return e ? e.value : ""; }
function setText(id, text){ const e = document.getElementById(id); if(e) e.textContent = text; }
function fmt(n, decimals, minDecimals){
  if(decimals === undefined) decimals = 2;
  if(minDecimals === undefined) minDecimals = 0;
  if(n === null || n === undefined || !isFinite(n)) return "N/A";
  return Number(n.toFixed(decimals)).toLocaleString(undefined, { minimumFractionDigits: minDecimals, maximumFractionDigits: decimals });
}
function money(n){
  if(!isFinite(n)) return "N/A";
  const s = fmt(Math.abs(n), 2, 2);
  return (n < 0 && Number(Math.abs(n).toFixed(2)) !== 0 ? "-$" : "$") + s;
}
function pct(n, decimals){ if(decimals===undefined) decimals=2; return isFinite(n) ? (fmt(n*100, decimals) + "%") : "N/A"; }
function wireLive(ids, fn){
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", fn);
  });
  fn();
}
function log10(x){ return Math.log(x) / Math.LN10; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ================= Local storage helpers ================= */
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v === null ? fallback : v; }catch(e){ return fallback; }
}
function lsSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

/* ================= Distance units (ft / m) ================= */
const FT_PER_M = 3.28084;
function getUnits(){ return lsGet("toolkitUnits", "ft") === "m" ? "m" : "ft"; }
function unitWord(){ return getUnits() === "m" ? "meters" : "feet"; }
function unitAbbr(){ return getUnits() === "m" ? "m" : "ft"; }
function toMeters(v){ return getUnits() === "m" ? v : v / FT_PER_M; }
function toUnits(meters){ return getUnits() === "m" ? meters : meters * FT_PER_M; }

/* ================= Persisted "business constant" fields ================= */
/* Values typed into these fields are remembered between visits. */
const PERSIST_IDS = [
  "dp_taxrate","rd_taxrate",
  "gp_cardpct","gp_target",
  "fp_term","fp_fee",
  "tep_cap","tep_fee",
  "smp_pct",
  "comm_rate",
  "deal_card","deal_tax","deal_term","deal_finfee","deal_comm","deal_commbasis",
  "sw_amin",
  "cl_volts","cl_breaker","cl_derate"
];
function restorePersisted(root){
  PERSIST_IDS.forEach(id => {
    const el = root.querySelector("#" + id);
    if(!el) return;
    const saved = lsGet("toolkit:" + id, null);
    if(saved !== null) el.value = saved;
    el.addEventListener("input", () => lsSet("toolkit:" + id, el.value));
    el.addEventListener("change", () => lsSet("toolkit:" + id, el.value));
  });
}

/* ================= Calculator registry ================= */
const CALCS = {};
/* Extra search keywords per calculator (names are searched automatically). */
const CALC_KEYWORDS = {};

</script>

    wireLive(["sta_orig","sta_origTax","sta_new"], () => {

      if(origTax === 0 || orig === 0){ ids.forEach(id => setText(id,"N/A")); return; }
      const taxShare = (origTax-orig)/origTax;

      setText("sta_taxdollar", money(origTax-orig));
      setText("sta_newtax", money(newP*taxShare));
      setText("sta_newadj", money((newP*orig)/origTax));
      setText("sta_cover", money((orig*orig)/origTax));

      <p class="note">Card fee is charged on the sell price. Monthly payment spreads the tax-inclusive total over the term (no interest). Gross profit = sell price − cost − shipping − card fee.</p>

  `,
  init: () => {
    wireLive(["deal_list","deal_disc","deal_cost","deal_ship","deal_card","deal_tax","deal_term","deal_finfee","deal_comm"], compute);
    document.getElementById("deal_commbasis").addEventListener("change", compute);
    function compute(){
      const list = num("deal_list"), dp = num("deal_disc")/100, cost = num("deal_cost"), ship = num("deal_ship");
      const card = num("deal_card")/100, tax = num("deal_tax")/100, term = num("deal_term"), finfee = num("deal_finfee")/100, comm = num("deal_comm")/100;
      const discAmt = list*dp, sell = list-discAmt, cardAmt = sell*card;
      const gp = sell-cost-ship-cardAmt;
      const taxAmt = sell*tax, total = sell+taxAmt;
      setText("deal_discamt", money(discAmt));
      setText("deal_sell", money(sell));
      setText("deal_cardamt", money(cardAmt));
      setText("deal_gp", money(gp));
      setText("deal_gm", sell > 0 ? pct(gp/sell, 1) : "N/A");
      setText("deal_taxamt", money(taxAmt));
      setText("deal_total", money(total));
      setText("deal_monthly", term > 0 ? money(total/term) : "N/A");
      setText("deal_finamt", money(total*finfee));
      const basis = strVal("deal_commbasis") === "gp" ? gp : sell;
      setText("deal_commamt", money(basis*comm));
    }
  }
};

      </div>
      <div class="field-grid">
        <div class="field"><label>Reverb / Reflectivity</label>
          <select id="csn_reverb">
            <option>Dead</option><option>Low (+2dB)</option><option>Medium (+4dB)</option><option selected>High (+6dB)</option>
          </select>
        </div>
        <div class="field"><label>Amp Power Output</label>
          <select id="csn_amplevel">
            <option>Full</option><option>Half (-3dB)</option><option selected>1/4 (-6dB)</option>
          </select>
        </div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Speaker Rows × Columns</div><div class="value" id="csn_grid">–</div></div>
        <div class="out-box"><div class="label">Total Speakers</div><div class="value" id="csn_total">–</div></div>
        <div class="out-box"><div class="label">Amp Requirement</div><div class="value" id="csn_amp">–</div></div>
        <div class="out-box"><div class="label">dB at Listener Height</div><div class="value" id="csn_dblisten">–</div></div>
        <div class="out-box"><div class="label">SPL at Coverage Edge</div><div class="value" id="csn_dbedge">–</div></div>
        <div class="out-box"><div class="label">dB Variance</div><div class="value" id="csn_variance">–</div></div>
      </div>
      <p class="note">Coverage estimates are generalized and do not replace an acoustic design. Speaker counts round up so the room is fully covered; treat dB figures as rough guides, not precise predictions.</p>
    </div>
  `,
  init: () => {
    const modelSel = document.getElementById("csn_model");
    const tapSel = document.getElementById("csn_tap");
    const tapManualEl = document.getElementById("csn_tap_manual");
    const dispEl = document.getElementById("csn_disp");
    const sensEl = document.getElementById("csn_sens");

    function refreshModel(){
      const idx = modelSel.value;
      if(idx === ""){
        dispEl.disabled = false; sensEl.disabled = false;
        tapSel.innerHTML = `<option value="">—</option>`;
        tapSel.disabled = true;
        tapManualEl.disabled = false;
      } else {
        const s = SPEAKER_DB[Number(idx)];
        dispEl.value = s[2]; sensEl.value = s[1];
        dispEl.disabled = true; sensEl.disabled = true;
        tapSel.innerHTML = s[3].map(t => `<option value="${t}">${t} W</option>`).join("");
        tapSel.disabled = false;
        tapManualEl.disabled = true;
      }
      compute();
    }
    modelSel.addEventListener("change", refreshModel);
    tapManualEl.addEventListener("input", compute);

    function compute(){
      const dispersion = num("csn_disp");
      const sensitivity = num("csn_sens");
      const tap = tapSel.disabled ? (Number(tapManualEl.value) || 0) : (Number(tapSel.value) || 0);
      const ceilH = num("csn_ceil"), listenH = num("csn_listen"), width = num("csn_width"), length = num("csn_length");
      const reverb = strVal("csn_reverb"), ampLevel = strVal("csn_amplevel");

      const hval = ceilH - listenH;
      if(hval <= 0 || tap <= 0){
        ["csn_grid","csn_total","csn_amp","csn_dblisten","csn_dbedge","csn_variance"].forEach(id => setText(id,"N/A"));
        return;
      }
      const coverageRadius = Math.tan(dispersion/2 * Math.PI/180) * hval;
      const spacing = 1.414*coverageRadius;
      if(spacing <= 0){
        ["csn_grid","csn_total","csn_amp","csn_dblisten","csn_dbedge","csn_variance"].forEach(id => setText(id,"N/A"));
        return;
      }
      const rows = Math.max(1, Math.ceil(length/spacing - 1e-9));
      const cols = Math.max(1, Math.ceil(width/spacing - 1e-9));
      const total = rows*cols;
      const ampReq = tap*total*1.2;
      const gainForm = Math.round(10*log10(tap));
      const powerGain = sensitivity + gainForm;
      const dbLoss = Math.round(20*log10(listenH/3.28));
      const reverbAdj = { "Dead":0, "Low (+2dB)":2, "Medium (+4dB)":4, "High (+6dB)":6 }[reverb] || 0;
      const ampAdj = { "Full":0, "Half (-3dB)":-3, "1/4 (-6dB)":-6 }[ampLevel] || 0;
      const dbAtListener = powerGain - dbLoss + reverbAdj + ampAdj;

      const angleFromVertical = 90 - dispersion/2;
      const edgeSlant = Math.round(listenH/Math.sin(angleFromVertical*Math.PI/180));
      const edgeLoss = 20*log10(edgeSlant/3.28);
      const overlapBonus = total >= 4 ? 3 : 0;
      const edgeSPL = powerGain - edgeLoss + overlapBonus;
      const variance = edgeSPL - dbAtListener;

      setText("csn_grid", `${rows} × ${cols}`);
      setText("csn_total", total);
      setText("csn_amp", fmt(ampReq,1) + " W");
      setText("csn_dblisten", fmt(dbAtListener,1) + " dB");
      setText("csn_dbedge", fmt(edgeSPL,2) + " dB");
      setText("csn_variance", fmt(variance,2) + " dB");
    }
    wireLive(["csn_disp","csn_sens","csn_ceil","csn_listen","csn_width","csn_length"], compute);
    tapSel.addEventListener("change", compute);
    document.getElementById("csn_reverb").addEventListener("change", compute);
    document.getElementById("csn_amplevel").addEventListener("change", compute);
    refreshModel();
  }
};

function wmParseRange(str){
  const nums = (str.match(/\d+(\.\d+)?/g)||[]).map(Number);
  if(nums.length===0) return null;
  return { min: Math.min(...nums), max: Math.max(...nums) };
}

      tabsEl.innerHTML = catIds.map(id => `<button data-id="${id}" class="${id===activeCat?'active':''}">${CATS[id].label}</button>`).join("");
      tabsEl.querySelectorAll("button").forEach(btn => {

      return `<div class="wm-col">

        <div class="wm-bands" data-mfr="${m}"></div>

    }

    function renderBody(){
      renderTabs();
      const data = CATS[activeCat].data;
      const mfrs = WM_MANUFACTURERS.filter(m => data[m]);
      bodyEl.innerHTML = `<div class="wm-columns">${mfrs.map(m => renderColumn(m, data)).join("")}</div>`;
      mfrs.forEach(m => {
        const sel = bodyEl.querySelector(`select[data-mfr="${m}"]`);
        sel.value = state[activeCat].selectedLine[m];
        sel.addEventListener("change", () => {
          const st = state[activeCat];
          st.selectedLine[m] = sel.value;
          if(st.selectedBand && st.selectedBand.mfr === m) st.selectedBand = null;
          renderBands();
        });
      });
      renderBands();
    }

    function renderBands(){
      const st = state[activeCat];
      const data = CATS[activeCat].data;
      const mfrs = WM_MANUFACTURERS.filter(m => data[m]);
      let selRange = null, selMfr = null;
      if(st.selectedBand){
        selMfr = st.selectedBand.mfr;
        const bands = data[selMfr][st.selectedBand.line];
        selRange = wmParseRange(bands[st.selectedBand.idx][1]);
      }
      mfrs.forEach(m => {
        const line = st.selectedLine[m];
        const bands = data[m][line];
        let distances = [];
        if(selRange && m !== selMfr){
          distances = bands.map(([,r]) => {
            const pr = wmParseRange(r);
            if(!pr) return { overlap:false, dist:Infinity };
            const overlap = selRange.min <= pr.max && pr.min <= selRange.max;
            const mid1 = (selRange.min+selRange.max)/2, mid2 = (pr.min+pr.max)/2;
            return { overlap, dist: Math.abs(mid1-mid2) };
          });
        }
        const anyOverlap = distances.some(d => d.overlap);
        let minDist = Infinity;
        if(!anyOverlap && distances.length) minDist = Math.min(...distances.map(d => d.dist));

        const container = bodyEl.querySelector(`.wm-bands[data-mfr="${m}"]`);
        container.innerHTML = bands.map(([label, r], idx) => {
          let cls = "";
          if(selMfr===m && st.selectedBand.line===line && st.selectedBand.idx===idx) cls = "selected";
          else if(selRange && m !== selMfr){
            const d = distances[idx];
            if(anyOverlap && d.overlap) cls = "overlap";
            else if(!anyOverlap && d.dist === minDist) cls = "near";
          }
          return `<button class="wm-chip ${cls}" data-idx="${idx}"><span>${label}</span><span class="range">${r} MHz</span></button>`;
        }).join("");
        container.querySelectorAll(".wm-chip").forEach(btn => {
          btn.addEventListener("click", () => {
            st.selectedBand = { mfr: m, line, idx: Number(btn.dataset.idx) };
            renderBands();
          });
        });
      });
    }

    renderBody();
  }
};

        <div class="field"><label>Color Needed?</label><select id="blc_color"><option>Yes</option><option>No</option></select></div>
        <div class="field"><label>Movers Needed?</label><select id="blc_movers"><option>Yes</option><option>No</option></select></div>
        <div class="field"><label>How Many Movers</label><input type="number" id="blc_numMovers" value="2" step="1"></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Zone Grid</div><div class="value" id="blc_grid">–</div></div>
        <div class="out-box"><div class="label">PAR Fixture</div><div class="value" id="blc_parmodel">–</div></div>
        <div class="out-box"><div class="label">Mover Fixture</div><div class="value" id="blc_movermodel">–</div></div>
        <div class="out-box"><div class="label">Total Cost</div><div class="value" id="blc_total">–</div></div>
        <div class="out-box"><div class="label">DMX Universes</div><div class="value" id="blc_universes">–</div></div>
      </div>
      <details class="prices">
        <summary>Fixture prices (edit to keep current)</summary>
        <div class="field-grid" style="margin-top:12px;">
          ${ALL_FIXTURES.map((f,i) => `<div class="field"><label>${f.model} ($)</label><input type="number" id="blc_price_${i}" value="${f.price}" step="1"></div>`).join("")}
        </div>
        <p class="hint">Prices are rough estimates and are saved on this device. Safety cables and clamps are figured at $3.98 and $13.95 each.</p>
      </details>
    </div>
  `,
  init: () => {
    ALL_FIXTURES.forEach((f,i) => {
      const el = document.getElementById("blc_price_" + i);
      el.addEventListener("input", () => {
        const v = parseFloat(el.value);
        if(!isNaN(v)){ f.price = v; lsSet("toolkit:price:" + f.model, String(v)); }
        compute();
      });
    });
    function compute(){
      const width = num("blc_width"), depth = num("blc_depth"), throwDist = num("blc_throw");
      const colorNeeded = strVal("blc_color") === "Yes";
      const moversNeeded = strVal("blc_movers") === "Yes";
      const numMovers = num("blc_numMovers");

      const zoneCols = Math.max(1, Math.floor(width/6));
      const zoneRows = Math.max(1, Math.floor(depth/6));
      const parQty = Math.max(zoneCols*zoneRows*2, 1);
      const parList = colorNeeded ? FIXTURE_CATALOG.par : FIXTURE_CATALOG.parNoColor;
      const parFixture = pickFixture(parList, throwDist);
      const parCost = parFixture ? parFixture.price*parQty : 0;

      const moverQty = moversNeeded ? numMovers : 0;
      const moverFixture = moversNeeded ? pickFixture(FIXTURE_CATALOG.mover, throwDist) : null;
      const moverCost = moverFixture ? moverFixture.price*moverQty : 0;

      const safetyQty = parQty + moverQty;
      const safetyCost = 3.98*safetyQty;
      const clampCost = 13.95*safetyQty;

      const totalCost = parCost + safetyCost + clampCost + moverCost;
      const totalChannels = (parFixture?parFixture.channels*parQty:0) + (moverFixture?moverFixture.channels*moverQty:0);
      const universes = Math.ceil(totalChannels/512);

      setText("blc_grid", `${zoneCols} × ${zoneRows} zones (${parQty} PARs)`);
      setText("blc_parmodel", parFixture ? `${parFixture.model} ($${parFixture.price})` : "N/A");
      setText("blc_movermodel", moverFixture ? `${moverFixture.model} ($${moverFixture.price})` : (moversNeeded ? "N/A" : "None needed"));
      setText("blc_total", money(totalCost));
      setText("blc_universes", universes || 0);
    }
    wireLive(["blc_width","blc_depth","blc_throw","blc_numMovers"], compute);
    document.getElementById("blc_color").addEventListener("change", compute);
    document.getElementById("blc_movers").addEventListener("change", compute);
  }
};

const CONVERT_UNITS = {
  length: { In:0.0254, Ft:0.3048, Yard:0.9144, Mile:1609.344, Meter:1, Cm:0.01, Mm:0.001 },
  weight: { Lb:0.45359237, Kg:1, Oz:0.028349523, Gram:0.001 },
  temperature: { "°F":1, "°C":1, "K":1 }
};
function convertTemp(v, from, to){
  let c;
  if(from === "°F") c = (v-32)*5/9; else if(from === "K") c = v-273.15; else c = v;
  if(to === "°F") return c*9/5+32;
  if(to === "K") return c+273.15;
  return c;
}

            <option value="length">Length</option>

    const catSel = document.getElementById("uc_cat");

      const units = Object.keys(CONVERT_UNITS[catSel.value]);
      fromSel.innerHTML = units.map(u => `<option>${u}</option>`).join("");
      toSel.innerHTML = units.map(u => `<option>${u}</option>`).join("");
      if(units.length > 1) toSel.selectedIndex = 1;
      compute();

    function compute(){
      const value = num("uc_value");
      let result;
      if(catSel.value === "temperature"){
        result = convertTemp(value, fromSel.value, toSel.value);
      } else {
        const table = CONVERT_UNITS[catSel.value];
        const from = table[fromSel.value], to = table[toSel.value];
        if(!from || !to){ setText("uc_out","N/A"); return; }
        result = value*from/to;
      }
      setText("uc_out", fmt(result,4) + " " + toSel.value);
    }
    catSel.addEventListener("change", refreshUnits);
    fromSel.addEventListener("change", compute);
    toSel.addEventListener("change", compute);
    document.getElementById("uc_value").addEventListener("input", compute);
    refreshUnits();
  }
};

      <div class="field-grid">
        <div class="field"><label>Value</label><input type="number" id="al_p" value="30" step="0.1"></div>
        <div class="field"><label>Unit</label><select id="al_pu"><option value="dBm">dBm</option><option value="mW">mW</option><option value="W">W</option></select></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">dBm</div><div class="value" id="al_dbm">–</div></div>
        <div class="out-box"><div class="label">Milliwatts</div><div class="value" id="al_mw">–</div></div>
        <div class="out-box"><div class="label">Watts</div><div class="value" id="al_w">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    const REF = 0.7745966692;
    function volt(){
      const v = num("al_v"), u = strVal("al_vu");
      let vrms;
      if(u === "dBu") vrms = REF*Math.pow(10, v/20);
      else if(u === "dBV") vrms = Math.pow(10, v/20);
      else vrms = v;
      if(!(vrms > 0)){ ["al_dbu","al_dbv","al_vrms"].forEach(id => setText(id,"N/A")); return; }
      setText("al_dbu", fmt(20*log10(vrms/REF),2) + " dBu");
      setText("al_dbv", fmt(20*log10(vrms),2) + " dBV");
      setText("al_vrms", fmt(vrms,4) + " V");
    }
    function power(){
      const v = num("al_p"), u = strVal("al_pu");
      let mw;
      if(u === "dBm") mw = Math.pow(10, v/10);
      else if(u === "W") mw = v*1000;
      else mw = v;
      if(!(mw > 0)){ ["al_dbm","al_mw","al_w"].forEach(id => setText(id,"N/A")); return; }
      setText("al_dbm", fmt(10*log10(mw),2) + " dBm");
      setText("al_mw", fmt(mw,3) + " mW");
      setText("al_w", fmt(mw/1000,4) + " W");
    }
    wireLive(["al_v"], volt); document.getElementById("al_vu").addEventListener("change", volt);
    wireLive(["al_p"], power); document.getElementById("al_pu").addEventListener("change", power);
  }
};

CALC_KEYWORDS.wattsVoltsAmps = "power electrical ohms law current";
CALCS.wattsVoltsAmps = {
  name: "Watts/Volts/Amps",
  render: () => `
    <div class="calc-card">
      <h2>Watts / Volts / Amps</h2>
      <p class="desc">Enter any two of Watts / Volts / Amps (leave the unknown at 0).</p>
      <div class="field-grid">
        <div class="field"><label>Watts (W)</label><input type="number" id="wva_w" value="0" step="1"></div>
        <div class="field"><label>Volts (V)</label><input type="number" id="wva_v" value="120" step="1"></div>
        <div class="field"><label>Amps (A)</label><input type="number" id="wva_a" value="20" step="0.1"></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Watts (Volts × Amps)</div><div class="value" id="wva_out1">–</div></div>
        <div class="out-box"><div class="label">Volts (Watts ÷ Amps)</div><div class="value" id="wva_out2">–</div></div>
        <div class="out-box"><div class="label">Amps (Watts ÷ Volts)</div><div class="value" id="wva_out3">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    wireLive(["wva_w","wva_v","wva_a"], () => {
      const w = num("wva_w"), v = num("wva_v"), a = num("wva_a");
      setText("wva_out1", (v>0&&a>0) ? fmt(v*a,2)+" W" : "N/A");
      setText("wva_out2", (w>0&&a>0) ? fmt(w/a,2)+" V" : "N/A");
      setText("wva_out3", (w>0&&v>0) ? fmt(w/v,2)+" A" : "N/A");
    });
  }
};

</script>
<script>
/* ================= Sections & Navigation ================= */
const SECTIONS = [
  { id:"favorites", title:"Favorites", items:["favorites"] },
  { id:"salesTools", title:"Sales Tools", items:["dealBuilder","salesTaxAdjustment","pricingTools","financing","commission"] },
  { id:"audio", title:"Audio", items:["ceilingSpeakerNeeds","splPower","speakerWiring","wavelengthSpeed","wirelessMics"] },
  { id:"lighting", title:"Lighting", items:["basicLightingCoverage","circuitLoad","lightingCheatsheet"] },
  { id:"converters", title:"Converters", items:["rackSpace","unitConverter","dbConverter","audioLevels","wattsVoltsAmps"] }
];

function findSection(calcId){
  return SECTIONS.find(s => s.items.indexOf(calcId) !== -1) || null;
}

let activeSection = SECTIONS[0].id;
let activeCalc = SECTIONS[0].items[0];

function setHash(id){
  try{ history.replaceState(null, "", "#" + id); }
  catch(e){ try{ location.hash = id; }catch(e2){ /* ignore */ } }
}

function navigateTo(calcId){
  const sec = findSection(calcId);
  if(!sec || !CALCS[calcId]) return;
  activeSection = sec.id;
  activeCalc = calcId;
  renderAll();
}

function renderSectionTabs(){
  const el = document.getElementById("sectionTabs");
  el.innerHTML = SECTIONS.map(s => `<button data-id="${s.id}" class="${s.id===activeSection?'active':''}">${s.title}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeSection = btn.dataset.id;
      activeCalc = SECTIONS.find(s => s.id===activeSection).items[0];
      renderAll();
    });
  });
}
function renderSidebar(){
  const el = document.getElementById("sidebar");
  const layout = document.querySelector(".layout");
  const section = SECTIONS.find(s => s.id===activeSection);
  if(section.items.length <= 1){
    el.innerHTML = "";
    layout.classList.add("full-width");
    return;
  }
  layout.classList.remove("full-width");
  el.innerHTML = section.items.map(id => `<button data-id="${id}" class="${id===activeCalc?'active':''}">${CALCS[id].name}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { activeCalc = btn.dataset.id; renderMain(); highlightSidebar(); });
  });
}
function highlightSidebar(){
  document.querySelectorAll("#sidebar button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.id === activeCalc);
  });
}

/* ---------- Recent tools ---------- */
function getRecent(){
  try{ const r = JSON.parse(lsGet("toolkitRecent", "[]")); return Array.isArray(r) ? r.filter(id => CALCS[id] && id !== "favorites") : []; }
  catch(e){ return []; }
}
function pushRecent(id){
  if(id === "favorites") return;
  const list = [id].concat(getRecent().filter(x => x !== id)).slice(0, 5);
  lsSet("toolkitRecent", JSON.stringify(list));
}
function fillRecent(){
  const bar = document.getElementById("recentBar");
  if(!bar) return;
  const list = getRecent();
  if(!list.length){ bar.style.display = "none"; return; }
  bar.innerHTML = `<span class="lbl">Recent</span>` + list.map(id => `<button data-id="${id}">${esc(CALCS[id].name)}</button>`).join("");
  bar.querySelectorAll("button").forEach(b => b.addEventListener("click", () => navigateTo(b.dataset.id)));
}

/* ---------- Per-card tools (Copy / Reset / Clear) and accessibility ---------- */
function flash(btn, text){
  const old = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { btn.textContent = old; }, 1200);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  }
  legacyCopy(text);
  return Promise.resolve();
}
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function cardSummary(card){
  const lines = [];
  const h = card.querySelector("h2");
  if(h) lines.push(h.textContent.trim());
  card.querySelectorAll(".field").forEach(f => {
    const l = f.querySelector("label"), c = f.querySelector("input,select");
    if(l && c && f.style.display !== "none"){
      const v = c.tagName === "SELECT" ? (c.options[c.selectedIndex] ? c.options[c.selectedIndex].text : "") : c.value;
      lines.push(l.textContent.trim() + ": " + v);
    }
  });
  lines.push("—");
  card.querySelectorAll(".out-box").forEach(o => {
    const l = o.querySelector(".label"), v = o.querySelector(".value");
    if(l && v) lines.push(l.textContent.trim() + ": " + v.textContent.trim());
  });
  return lines.join("\n");
}
function decorateCards(root){
  root.querySelectorAll(".field").forEach(f => {
    const l = f.querySelector("label"), c = f.querySelector("input,select");
    if(l && c && c.id && !l.getAttribute("for")) l.setAttribute("for", c.id);
  });
  root.querySelectorAll('input[type="number"]').forEach(i => i.setAttribute("inputmode", "decimal"));
  root.querySelectorAll(".calc-card").forEach(card => {
    if(!card.querySelector('input[type="number"], .out-box')) return;
    const tools = document.createElement("div");
    tools.className = "card-tools";
    tools.innerHTML = `<button type="button" data-act="copy" title="Copy inputs and results">Copy</button><button type="button" data-act="reset" title="Restore the example values">Reset</button><button type="button" data-act="clear" title="Empty all number fields">Clear</button>`;
    card.insertBefore(tools, card.firstChild);
    tools.addEventListener("click", ev => {
      const btn = ev.target.closest("button");
      if(!btn) return;
      const act = btn.dataset.act;
      if(act === "copy"){
        copyText(cardSummary(card)).then(() => flash(btn, "Copied"));
      } else if(act === "reset"){
        card.querySelectorAll('input[type="number"]').forEach(i => { i.value = i.defaultValue; i.dispatchEvent(new Event("input", {bubbles:true})); });
        card.querySelectorAll("select").forEach(s => {
          const idx = Array.prototype.findIndex.call(s.options, o => o.defaultSelected);
          s.selectedIndex = idx >= 0 ? idx : 0;
          s.dispatchEvent(new Event("change", {bubbles:true}));
        });
      } else if(act === "clear"){
        card.querySelectorAll('input[type="number"]').forEach(i => { i.value = ""; i.dispatchEvent(new Event("input", {bubbles:true})); });
      }
    });
  });
}

function renderMain(){
  const calc = CALCS[activeCalc];
  const panel = document.getElementById("mainPanel");
  panel.innerHTML = calc.render();
  restorePersisted(panel);
  calc.init();
  decorateCards(panel);
  if(activeCalc === "favorites") fillRecent();
  pushRecent(activeCalc);
  setHash(activeCalc);
}
function renderAll(){
  renderSectionTabs();
  renderSidebar();
  renderMain();
}

/* ---------- Search ---------- */
const SEARCH_INDEX = [];
SECTIONS.forEach(sec => {
  sec.items.forEach(id => {
    if(id === "favorites") return;
    SEARCH_INDEX.push({ id, name: CALCS[id].name, section: sec.title,
      hay: (CALCS[id].name + " " + sec.title + " " + (CALC_KEYWORDS[id] || "")).toLowerCase() });
  });
});
function searchCalcs(q){
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!tokens.length) return [];
  return SEARCH_INDEX
    .filter(e => tokens.every(t => e.hay.indexOf(t) !== -1))
    .sort((a,b) => {
      const an = tokens.every(t => a.name.toLowerCase().indexOf(t) !== -1) ? 0 : 1;
      const bn = tokens.every(t => b.name.toLowerCase().indexOf(t) !== -1) ? 0 : 1;
      return an - bn;
    })
    .slice(0, 8);
}
(function setupSearch(){
  const box = document.getElementById("searchBox");
  const results = document.getElementById("searchResults");
  let current = [], sel = -1;
  function close(){ results.hidden = true; sel = -1; }
  function pick(id){ box.value = ""; close(); navigateTo(id); box.blur(); }
  function paint(){
    if(!box.value.trim()){ close(); return; }
    current = searchCalcs(box.value);
    results.hidden = false;
    results.innerHTML = current.length
      ? current.map((e,i) => `<button type="button" data-id="${e.id}" class="${i===sel?'sel':''}"><span>${esc(e.name)}</span><span class="sec">${esc(e.section)}</span></button>`).join("")
      : `<div class="none">No calculators match "${esc(box.value)}"</div>`;
    results.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", ev => { ev.preventDefault(); pick(b.dataset.id); }));
  }
  box.addEventListener("input", () => { sel = -1; paint(); });
  box.addEventListener("keydown", ev => {
    if(ev.key === "ArrowDown"){ ev.preventDefault(); sel = Math.min(sel+1, current.length-1); paint(); }
    else if(ev.key === "ArrowUp"){ ev.preventDefault(); sel = Math.max(sel-1, 0); paint(); }
    else if(ev.key === "Enter"){ const t = current[sel >= 0 ? sel : 0]; if(t) pick(t.id); }
    else if(ev.key === "Escape"){ box.value = ""; close(); }
  });
  box.addEventListener("blur", () => setTimeout(close, 120));
  box.addEventListener("focus", () => { if(box.value.trim()) paint(); });
})();

/* ---------- Select-all when tapping a number field ---------- */
document.addEventListener("focusin", ev => {
  const t = ev.target;
  if(t && t.tagName === "INPUT" && t.type === "number"){ try{ t.select(); }catch(e){} }
});

/* ---------- Theme + units toggles ---------- */
(function(){
  const btn = document.getElementById("themeToggle");
  function syncLabel(){
    const t = document.documentElement.getAttribute("data-theme");
    btn.textContent = t === "dark" ? "Light Mode" : "Dark Mode";
  }
  btn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    lsSet("toolkitTheme", next);
    syncLabel();
  });
  syncLabel();

  const ub = document.getElementById("unitToggle");
  function syncUnits(){ ub.textContent = "Distance: " + unitAbbr(); }
  ub.addEventListener("click", () => {
    lsSet("toolkitUnits", getUnits() === "ft" ? "m" : "ft");
    syncUnits();
    renderMain();
  });
  syncUnits();
})();

/* ---------- Deep linking (#calculatorId) ---------- */
function applyHash(){
  const id = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(id && CALCS[id] && findSection(id)) navigateTo(id);
}
window.addEventListener("hashchange", () => {
  const id = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(id && id !== activeCalc) applyHash();
});

(function start(){
  const id = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(id && CALCS[id] && findSection(id)){
    const sec = findSection(id);
    activeSection = sec.id; activeCalc = id;
  }
  renderAll();
})();

/* ---------- PWA service worker registration ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {/* ignore */});
  });
}

</script>
