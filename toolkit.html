<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alan's Toolkit</title>
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Super Tall business calculators, the Pro AV Toolkit, and more.">
<link rel="manifest" href="toolkit-manifest.json">
<link rel="icon" href="toolkit-icon-192.png">
<link rel="apple-touch-icon" href="toolkit-icon-192.png">
<style>
  :root{
    --bg: #f4f5f9;
    --card: #ffffff;
    --border: #e6e8f0;
    --text: #1a1d29;
    --text-muted: #6b7185;
    --accent: #4f46e5;
    --accent-soft: #eef0fe;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(20,20,43,0.04), 0 8px 24px rgba(20,20,43,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 20px 16px 48px;
  }
  .wrap{ max-width: 1100px; margin: 0 auto; }
  header.app-header{ text-align:center; margin-bottom: 20px; }
  header.app-header h1{ font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  header.app-header p{ color: var(--text-muted); margin: 0; font-size: 0.9rem; }

  .section-tabs{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom: 18px;
  }
  .section-tabs button{
    font-family: inherit; font-size: 0.9rem; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-muted); cursor: pointer;
  }
  .section-tabs button.active{ background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout{ display:grid; grid-template-columns: 240px 1fr; gap: 20px; align-items:start; }
  @media (max-width: 780px){ .layout{ grid-template-columns: 1fr; } }

  .sidebar{
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px; display:flex; flex-direction:column; gap:4px;
  }
  .sidebar button{
    text-align:left; font-family:inherit; font-size:0.85rem; font-weight:600;
    padding: 10px 12px; border-radius: 10px; border:none; background:transparent;
    color: var(--text); cursor:pointer;
  }
  .sidebar button.active{ background: var(--accent-soft); color: var(--accent); }
  .sidebar button:hover:not(.active){ background:#f6f7fb; }

  .main-panel{ display:flex; flex-direction:column; gap:16px; }
  .calc-card{
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px;
  }
  .calc-card h2{ font-size:1.1rem; margin:0 0 6px; font-weight:700; }
  .calc-card .desc{ font-size:0.82rem; color: var(--text-muted); margin: 0 0 16px; line-height:1.45; }
  .calc-card .credit{ font-size:0.72rem; color: var(--text-muted); font-style:italic; margin: -10px 0 16px; }

  .field-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom: 16px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:0.72rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; }
  select, input[type="number"], input[type="text"]{
    font-family:inherit; font-size:0.92rem; padding:8px 10px; border-radius:9px;
    border:1px solid var(--border); background:#fbfbfd; color:var(--text); width:100%;
  }
  select:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .output-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:10px; }
  .out-box{
    background: var(--accent-soft); border-radius:12px; padding:12px 14px;
  }
  .out-box .label{ font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:#4338ca; margin-bottom:4px; }
  .out-box .value{ font-size:1.15rem; font-weight:800; color:#3730a3; }
  .out-box.na .value{ color: var(--text-muted); font-weight:700; font-size:0.95rem; }

  .divider{ border:none; border-top:1px dashed var(--border); margin: 18px 0; }
  .sub-heading{ font-size:0.85rem; font-weight:700; margin: 0 0 10px; }

  .pill-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .pill-tabs button{
    font-family:inherit; font-size:0.75rem; font-weight:700; padding:7px 14px;
    border-radius:999px; border:1px solid var(--border); background:#fbfbfd; color:var(--text-muted); cursor:pointer;
  }
  .pill-tabs button.active{ background: var(--accent); color:#fff; border-color:var(--accent); }

  .radio-row{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .radio-row label{ font-size:0.85rem; display:flex; align-items:center; gap:5px; font-weight:500; text-transform:none; color:var(--text); }

  footer{ text-align:center; color:var(--text-muted); font-size:0.75rem; margin-top:28px; }
  table.ref-table{ width:100%; border-collapse:collapse; font-size:0.8rem; margin-top:8px; }
  table.ref-table th, table.ref-table td{ text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); }
  table.ref-table th{ color:var(--text-muted); font-weight:700; font-size:0.7rem; text-transform:uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>Alan's Toolkit</h1>
    <p>Super Tall business calculators, the Pro AV Toolkit, and a few equally strong extras.</p>
  </header>

  <div class="section-tabs" id="sectionTabs"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-panel" id="mainPanel"></div>
  </div>

  <footer>Alan's Toolkit — built from the Super Spreadsheet. dB Level Converter originally created by Murat Böyük Pilavci (stardustmedia).</footer>
</div>

<script>
/* ================= Utilities ================= */
function num(id){ const e = document.getElementById(id); if(!e) return 0; const v = parseFloat(e.value); return isNaN(v) ? 0 : v; }
function strVal(id){ const e = document.getElementById(id); return e ? e.value : ""; }
function setText(id, text){ const e = document.getElementById(id); if(e) e.textContent = text; }
function fmt(n, decimals){
  if(decimals === undefined) decimals = 2;
  if(n === null || n === undefined || !isFinite(n)) return "N/A";
  return Number(n.toFixed(decimals)).toLocaleString(undefined, { maximumFractionDigits: decimals });
}
function money(n){ return isFinite(n) ? ("$" + fmt(n,2)) : "N/A"; }
function pct(n, decimals){ if(decimals===undefined) decimals=2; return isFinite(n) ? (fmt(n*100, decimals) + "%") : "N/A"; }
function wireLive(ids, fn){
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", fn);
  });
  fn();
}
function log10(x){ return Math.log(x) / Math.LN10; }

/* ================= Calculator registry ================= */
const CALCS = {};

/* ---------- SHARED: Parallel Impedance ---------- */
CALCS.impedance = {
  name: "Parallel Impedance",
  render: () => `
    <div class="calc-card">
      <h2>Parallel Impedance</h2>
      <p class="desc">Total impedance of up to four passive speakers daisy-chained in parallel.</p>
      <div class="field-grid">
        <div class="field"><label>Speaker 1 Impedance (Ω)</label><input type="number" id="imp_z1" value="8" step="1"></div>
        <div class="field"><label>Speaker 2 Impedance (Ω)</label><input type="number" id="imp_z2" value="8" step="1"></div>
        <div class="field"><label>Speaker 3 Impedance (Ω)</label><input type="number" id="imp_z3" value="0" step="1"></div>
        <div class="field"><label>Speaker 4 Impedance (Ω)</label><input type="number" id="imp_z4" value="0" step="1"></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Channel Impedance</div><div class="value" id="imp_out">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    wireLive(["imp_z1","imp_z2","imp_z3","imp_z4"], () => {
      const zs = [num("imp_z1"), num("imp_z2"), num("imp_z3"), num("imp_z4")].filter(z => z > 0);
      if(zs.length === 0){ setText("imp_out","N/A"); return; }
      const channelZ = 1 / zs.reduce((s,z) => s + 1/z, 0);
      setText("imp_out", fmt(channelZ,2) + " Ω");
    });
  }
};

/* ---------- PRO AV: Wattage per Speaker ---------- */
CALCS.wattagePerSpeaker = {
  name: "Wattage per Speaker",
  render: () => `
    <div class="calc-card">
      <h2>Wattage per Speaker</h2>
      <p class="desc">Determine wattage delivered to each speaker in a parallel chain, based on power amp output.</p>
      <div class="field-grid">
        <div class="field"><label>Speaker 1 Impedance (Ω)</label><input type="number" id="wps_z1" value="8" step="1"></div>
        <div class="field"><label>Speaker 2 Impedance (Ω)</label><input type="number" id="wps_z2" value="8" step="1"></div>
        <div class="field"><label>Speaker 3 Impedance (Ω)</label><input type="number" id="wps_z3" value="0" step="1"></div>
        <div class="field"><label>Speaker 4 Impedance (Ω)</label><input type="number" id="wps_z4" value="0" step="1"></div>
        <div class="field"><label>Amp Wattage @ Channel Impedance</label><input type="number" id="wps_amp" value="3200" step="1"></div>
      </div>
      <div class="output-grid" id="wps_out"></div>
    </div>
  `,
  init: () => {
    wireLive(["wps_z1","wps_z2","wps_z3","wps_z4","wps_amp"], () => {
      const zs = [num("wps_z1"), num("wps_z2"), num("wps_z3"), num("wps_z4")];
      const active = zs.filter(z => z > 0);
      const out = document.getElementById("wps_out");
      if(active.length === 0){ out.innerHTML = `<div class="out-box na"><div class="label">Channel Impedance</div><div class="value">N/A</div></div>`; return; }
      const channelZ = 1 / active.reduce((s,z) => s + 1/z, 0);
      const amp = num("wps_amp");
      let html = `<div class="out-box"><div class="label">Channel Impedance</div><div class="value">${fmt(channelZ,2)} Ω</div></div>`;
      zs.forEach((z,i) => {
        if(z > 0){
          const w = Math.round(amp * channelZ / z);
          html += `<div class="out-box"><div class="label">Speaker ${i+1} Wattage</div><div class="value">${w} W</div></div>`;
        }
      });
      out.innerHTML = html;
    });
  }
};

/* ---------- PRO AV: SPL at Given Distance ---------- */
CALCS.splAtDistance = {
  name: "SPL at Given Distance",
  render: () => `
    <div class="calc-card">
      <h2>SPL at Given Distance</h2>
      <p class="desc">How much volume is lost over a specific distance — Inverse Square Law, no math required.</p>
      <div class="field-grid">
        <div class="field"><label>Speaker Sensitivity (dB @ 1W, 1M)</label><input type="number" id="spld_sens" value="130" step="0.1"></div>
        <div class="field"><label>Distance from Speakers (feet)</label><input type="number" id="spld_dist" value="30" step="1"></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">SPL at Target</div><div class="value" id="spld_out">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    wireLive(["spld_sens","spld_dist"], () => {
      const sens = num("spld_sens"), dist = num("spld_dist");
      if(dist <= 0){ setText("spld_out","N/A"); return; }
      const spl = log10(3.3/dist)*20 + sens;
      setText("spld_out", fmt(spl,2) + " dB");
    });
  }
};

/* ---------- PRO AV: Required Wattage for Desired SPL ---------- */
CALCS.requiredWattageSPL = {
  name: "Required Wattage for SPL",
  render: () => `
    <div class="calc-card">
      <h2>Required Wattage for Desired SPL</h2>
      <p class="desc">Figure out what size power amp you'll need for a system based on SPL requirements and room size.</p>
      <p class="desc" style="margin-top:-10px;">Reference targets: Ambient Music 75-85dB · Spoken Word 85dB · Average Band 95dB · Concert/Tour Audio &gt;100dB · Night Club/Bar 105-110dB</p>
      <div class="field-grid">
        <div class="field"><label>Distance from Speakers (M)</label><input type="number" id="rwspl_dist" value="30" step="1"></div>
        <div class="field"><label>Target SPL (dB)</label><input type="number" id="rwspl_target" value="100" step="1"></div>
        <div class="field"><label>Speaker Sensitivity (dB @ 1W, 1M)</label><input type="number" id="rwspl_sens" value="100" step="1"></div>
        <div class="field"><label>Ideal Headroom (dB)</label><input type="number" id="rwspl_head" value="3" step="1"></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">SPL Loss to Listener</div><div class="value" id="rwspl_loss">–</div></div>
        <div class="out-box"><div class="label">Power Ratio (dB, @1W)</div><div class="value" id="rwspl_ratio">–</div></div>
        <div class="out-box"><div class="label">Required Power</div><div class="value" id="rwspl_power">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    wireLive(["rwspl_dist","rwspl_target","rwspl_sens","rwspl_head"], () => {
      const dist = num("rwspl_dist"), target = num("rwspl_target"), sens = num("rwspl_sens"), head = num("rwspl_head");
      if(dist <= 0){ setText("rwspl_loss","N/A"); setText("rwspl_ratio","N/A"); setText("rwspl_power","N/A"); return; }
      const loss = 20*log10(1/dist);
      setText("rwspl_loss", fmt(loss,2) + " dB");
      const ratioRaw = target - sens + 20*log10(dist/1) + head;
      const ratio = Number(ratioRaw.toFixed(2)); // Excel chains off the rounded cell, not the raw value
      setText("rwspl_ratio", fmt(ratio,2) + " dB");
      const power = Math.pow(10, ratio/10);
      setText("rwspl_power", fmt(power,2) + " W");
    });
  }
};

/* ---------- PRO AV: Wavelength and Speed ---------- */
CALCS.wavelengthSpeed = {
  name: "Wavelength and Speed",
  render: () => `
    <div class="calc-card">
      <h2>Wavelength and Speed</h2>
      <p class="desc">How far a specific frequency sine wave travels in a free field — useful for speaker/subwoofer placement and acoustic treatment. Assumes the speed of sound is 1,132 feet/sec.</p>
      <div class="field-grid">
        <div class="field"><label>Wave Frequency (Hz)</label><input type="number" id="wls_freq" value="33" step="1"></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Distance / Speed of Travel</div><div class="value" id="wls_out">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    wireLive(["wls_freq"], () => {
      const f = num("wls_freq");
      if(f <= 0){ setText("wls_out","N/A"); return; }
      setText("wls_out", fmt(1132/f,2) + " feet/second");
    });
  }
};

/* ---------- PRO AV: Max SPL to Sensitivity ---------- */
CALCS.maxSPLToSensitivity = {
  name: "Max SPL to Sensitivity",
  render: () => `
    <div class="calc-card">
      <h2>Max SPL to Sensitivity</h2>
      <p class="desc">If a speaker only lists its Max SPL spec, use this to work out its System Sensitivity rating.</p>
      <div class="field-grid">
        <div class="field"><label>Max SPL (dB)</label><input type="number" id="msts_max" value="131" step="1"></div>
        <div class="field"><label>Peak Rating (Watts)</label><input type="number" id="msts_watts" value="1400" step="1"></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Speaker Sensitivity</div><div class="value" id="msts_out">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    wireLive(["msts_max","msts_watts"], () => {
      const maxSpl = num("msts_max"), watts = num("msts_watts");
      if(watts <= 0){ setText("msts_out","N/A"); return; }
      const sens = Math.round(maxSpl - 10*log10(watts));
      setText("msts_out", sens + " dB @ 1W, 1M");
    });
  }
};

CALCS.ceilingSpeakerNeeds = {
  name: "Indoor Ceiling Speaker Needs",
  render: () => `
    <div class="calc-card">
      <h2>Indoor Ceiling Speaker Needs</h2>
      <p class="desc">General number of 70V ceiling/pendant speakers needed for basic audio coverage. Numbers are general — for spaces needing precise designs, consult an in-house rep.</p>
      <div class="field-grid">
        <div class="field">
          <label>Speaker Model</label>
          <select id="csn_model">
            <option value="">Custom (enter my own specs)</option>
            ${SPEAKER_DB.map((s,i) => `<option value="${i}">${s[0]}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Wattage Tap (watts, from model)</label><select id="csn_tap"></select></div>
        <div class="field"><label>Wattage Tap (watts, custom)</label><input type="number" id="csn_tap_manual" value="15" step="0.5"></div>
        <div class="field"><label>Speaker Dispersion (degrees)</label><input type="number" id="csn_disp" value="120" step="1"></div>
        <div class="field"><label>Speaker Sensitivity (dB)</label><input type="number" id="csn_sens" value="90" step="1"></div>
      </div>
      <div class="field-grid">
        <div class="field"><label>Ceiling Height (feet)</label><input type="number" id="csn_ceil" value="16" step="0.5"></div>
        <div class="field"><label>Listener Height (feet)</label><input type="number" id="csn_listen" value="4" step="0.5"></div>
        <div class="field"><label>Room Width (feet)</label><input type="number" id="csn_width" value="35" step="1"></div>
        <div class="field"><label>Room Length (feet)</label><input type="number" id="csn_length" value="65" step="1"></div>
      </div>
      <div class="field-grid">
        <div class="field"><label>Reverb / Reflectivity</label>
          <select id="csn_reverb">
            <option>Dead</option><option>Low (+2dB)</option><option>Medium (+4dB)</option><option selected>High (+6dB)</option>
          </select>
        </div>
        <div class="field"><label>Amp Power Output</label>
          <select id="csn_amplevel">
            <option>Full</option><option>Half (-3dB)</option><option selected>1/4 (-6dB)</option>
          </select>
        </div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Speaker Rows × Columns</div><div class="value" id="csn_grid">–</div></div>
        <div class="out-box"><div class="label">Total Speakers</div><div class="value" id="csn_total">–</div></div>
        <div class="out-box"><div class="label">Amp Requirement</div><div class="value" id="csn_amp">–</div></div>
        <div class="out-box"><div class="label">dB at Listener Height</div><div class="value" id="csn_dblisten">–</div></div>
        <div class="out-box"><div class="label">SPL at Coverage Edge</div><div class="value" id="csn_dbedge">–</div></div>
        <div class="out-box"><div class="label">dB Variance</div><div class="value" id="csn_variance">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    const modelSel = document.getElementById("csn_model");
    const tapSel = document.getElementById("csn_tap");
    const tapManualEl = document.getElementById("csn_tap_manual");
    const dispEl = document.getElementById("csn_disp");
    const sensEl = document.getElementById("csn_sens");

    function refreshModel(){
      const idx = modelSel.value;
      if(idx === ""){
        dispEl.disabled = false; sensEl.disabled = false;
        tapSel.innerHTML = `<option value="">—</option>`;
        tapSel.disabled = true;
        tapManualEl.disabled = false;
      } else {
        const s = SPEAKER_DB[Number(idx)];
        dispEl.value = s[2]; sensEl.value = s[1];
        dispEl.disabled = true; sensEl.disabled = true;
        tapSel.innerHTML = s[3].map(t => `<option value="${t}">${t} W</option>`).join("");
        tapSel.disabled = false;
        tapManualEl.disabled = true;
      }
      compute();
    }
    modelSel.addEventListener("change", refreshModel);
    tapManualEl.addEventListener("input", compute);

    function compute(){
      const dispersion = num("csn_disp");
      const sensitivity = num("csn_sens");
      const tap = tapSel.disabled ? (Number(tapManualEl.value) || 0) : (Number(tapSel.value) || 0);
      const ceilH = num("csn_ceil"), listenH = num("csn_listen"), width = num("csn_width"), length = num("csn_length");
      const reverb = strVal("csn_reverb"), ampLevel = strVal("csn_amplevel");

      const hval = ceilH - listenH;
      if(hval <= 0 || tap <= 0){
        ["csn_grid","csn_total","csn_amp","csn_dblisten","csn_dbedge","csn_variance"].forEach(id => setText(id,"N/A"));
        return;
      }
      const coverageRadius = Math.tan(dispersion/2 * Math.PI/180) * hval;
      const spacing = 1.414*coverageRadius;
      if(spacing <= 0){
        ["csn_grid","csn_total","csn_amp","csn_dblisten","csn_dbedge","csn_variance"].forEach(id => setText(id,"N/A"));
        return;
      }
      const rows = Math.round(length/spacing);
      const cols = Math.round(width/spacing);
      const total = rows*cols;
      const ampReq = tap*total*1.2;
      const gainForm = Math.round(10*log10(tap));
      const powerGain = sensitivity + gainForm;
      const dbLoss = Math.round(20*log10(listenH/3.28));
      const reverbAdj = { "Dead":0, "Low (+2dB)":2, "Medium (+4dB)":4, "High (+6dB)":6 }[reverb] || 0;
      const ampAdj = { "Full":0, "Half (-3dB)":-3, "1/4 (-6dB)":-6 }[ampLevel] || 0;
      const dbAtListener = powerGain - dbLoss + reverbAdj + ampAdj;

      const angleFromVertical = 90 - dispersion/2;
      const edgeSlant = Math.round(listenH/Math.sin(angleFromVertical*Math.PI/180));
      const edgeLoss = 20*log10(edgeSlant/3.28);
      const overlapBonus = total >= 4 ? 3 : 0;
      const edgeSPL = powerGain - edgeLoss + overlapBonus;
      const variance = edgeSPL - dbAtListener;

      setText("csn_grid", `${rows} × ${cols}`);
      setText("csn_total", total);
      setText("csn_amp", fmt(ampReq,1) + " W");
      setText("csn_dblisten", fmt(dbAtListener,1) + " dB");
      setText("csn_dbedge", fmt(edgeSPL,2) + " dB");
      setText("csn_variance", fmt(variance,2) + " dB");
    }
    wireLive(["csn_disp","csn_sens","csn_ceil","csn_listen","csn_width","csn_length"], compute);
    tapSel.addEventListener("change", compute);
    document.getElementById("csn_reverb").addEventListener("change", compute);
    document.getElementById("csn_amplevel").addEventListener("change", compute);
    refreshModel();
  }
};

  render: () => `

        <div class="field"><label>Movers Needed?</label><select id="blc_movers"><option>Yes</option><option>No</option></select></div>

      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Zone Grid</div><div class="value" id="blc_grid">–</div></div>
        <div class="out-box"><div class="label">PAR Fixture</div><div class="value" id="blc_parmodel">–</div></div>

      </div>
    </div>
  `,
  init: () => {
    function compute(){
      const width = num("blc_width"), depth = num("blc_depth"), throwDist = num("blc_throw");
      const colorNeeded = strVal("blc_color") === "Yes";
      const moversNeeded = strVal("blc_movers") === "Yes";
      const numMovers = num("blc_numMovers");

      const zoneCols = Math.floor(width/6);
      const zoneRows = Math.floor(depth/6);
      const parQty = Math.max(zoneCols*zoneRows*2, 1);

      const safetyQty = parQty + moverQty;

      const clampCost = 13.95*safetyQty;

      const totalCost = parCost + safetyCost + clampCost + moverCost;
      const totalChannels = (parFixture?parFixture.channels*parQty:0) + (moverFixture?moverFixture.channels*moverQty:0);

      setText("blc_parmodel", parFixture ? `${parFixture.model} ($${parFixture.price})` : "N/A");

      setText("blc_total", money(totalCost));
      setText("blc_universes", universes || 0);
    }

    document.getElementById("blc_movers").addEventListener("change", compute);

};

const CONVERT_UNITS = {
  length: { In:0.0254, Ft:0.3048, Yard:0.9144, Mile:1609.34, Meter:1, Cm:0.01, Mm:0.001 },
  weight: { Lb:0.453592, Kg:1 }

CALCS.unitConverter = {
  name: "Unit Converter",
  render: () => `
    <div class="calc-card">
      <h2>Unit Converter</h2>
      <p class="desc">Length or weight, converted using a common base unit.</p>
      <div class="field-grid">
        <div class="field"><label>Category</label>
          <select id="uc_cat">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
          </select>
        </div>
        <div class="field"><label>Value</label><input type="number" id="uc_value" value="12" step="0.01"></div>
        <div class="field"><label>From</label><select id="uc_from"></select></div>
        <div class="field"><label>To</label><select id="uc_to"></select></div>
      </div>
      <div class="output-grid">
        <div class="out-box"><div class="label">Result</div><div class="value" id="uc_out">–</div></div>
      </div>
    </div>
  `,
  init: () => {
    const catSel = document.getElementById("uc_cat");
    const fromSel = document.getElementById("uc_from");
    const toSel = document.getElementById("uc_to");
    function refreshUnits(){
      const units = Object.keys(CONVERT_UNITS[catSel.value]);
      fromSel.innerHTML = units.map(u => `<option>${u}</option>`).join("");
      toSel.innerHTML = units.map(u => `<option>${u}</option>`).join("");
      if(units.length > 1) toSel.selectedIndex = 1;
      compute();
    }
    function compute(){
      const table = CONVERT_UNITS[catSel.value];
      const from = table[fromSel.value], to = table[toSel.value];
      const value = num("uc_value");
      if(!from || !to){ setText("uc_out","N/A"); return; }
      const result = value*from/to;
      setText("uc_out", fmt(result,4) + " " + toSel.value);
    }
    catSel.addEventListener("change", refreshUnits);
    fromSel.addEventListener("change", compute);
    toSel.addEventListener("change", compute);
    document.getElementById("uc_value").addEventListener("input", compute);
    refreshUnits();
  }
};

/* ================= Sections & Navigation ================= */
const SECTIONS = [
  { id:"superTall", title:"Super Tall", items:["salesTaxAdjustment","discountPercentage","reverseMIM","rackSpace","discountAllocator","impedance","grossProfit","financingPayment","threeEqualPayments","sixMonthPayment","commission","unitConverter"] },
  { id:"proAV", title:"Pro AV Toolkit", items:["impedance","wattagePerSpeaker","splAtDistance","requiredWattageSPL","wavelengthSpeed","maxSPLToSensitivity","ceilingSpeakerNeeds","basicLightingCoverage"] },
  { id:"equallyStrong", title:"Equally Strong", items:["dbConverter","lightingCheatsheet"] }
];

let activeSection = SECTIONS[0].id;
let activeCalc = SECTIONS[0].items[0];

function renderSectionTabs(){
  const el = document.getElementById("sectionTabs");
  el.innerHTML = SECTIONS.map(s => `<button data-id="${s.id}" class="${s.id===activeSection?'active':''}">${s.title}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeSection = btn.dataset.id;
      activeCalc = SECTIONS.find(s => s.id===activeSection).items[0];
      renderAll();
    });
  });
}
function renderSidebar(){
  const el = document.getElementById("sidebar");
  const section = SECTIONS.find(s => s.id===activeSection);
  el.innerHTML = section.items.map(id => `<button data-id="${id}" class="${id===activeCalc?'active':''}">${CALCS[id].name}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { activeCalc = btn.dataset.id; renderMain(); highlightSidebar(); });
  });
}
function highlightSidebar(){
  document.querySelectorAll("#sidebar button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.id === activeCalc);
  });
}
function renderMain(){
  const calc = CALCS[activeCalc];
  const panel = document.getElementById("mainPanel");
  panel.innerHTML = calc.render();
  calc.init();
}
function renderAll(){
  renderSectionTabs();
  renderSidebar();
  renderMain();
}
renderAll();
